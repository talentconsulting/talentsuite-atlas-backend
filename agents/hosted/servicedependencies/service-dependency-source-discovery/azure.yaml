# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: '>=1.0.0-beta.4'

name: service-dependency-source-discovery

services:
  service-dependency-source-discovery:
    project: src/service-dependency-source-discovery
    host: azure.ai.agent
    language: python
    uses: [ai-project]
    codeConfiguration:
      dependencyResolution: remote_build
      entryPoint: main.py
      runtime: python_3_13
    container:
      resources: { cpu: "0.5", memory: 1Gi }
    description: Selects bounded source files that evidence outbound HTTP API and gRPC dependencies in one public GitHub repository path.
    environmentVariables:
      - name: GITHUB_READ_TOKEN
        value: ${{connections.github-source-read.credentials.github_token}}
      - name: GITHUB_APP_ID
        value: ${{connections.atlas-github-app.credentials.app_id}}
      - name: GITHUB_APP_PRIVATE_KEY
        value: ${{connections.atlas-github-app.credentials.private_key}}
    kind: hosted
    name: service-dependency-source-discovery
    displayName: Service Dependency Source Discovery
    protocols:
      - protocol: responses
        version: 2.0.0
  ai-project:
    host: azure.ai.project
    endpoint: ${AZURE_AI_PROJECT_ENDPOINT}

infra:
  provider: microsoft.foundry

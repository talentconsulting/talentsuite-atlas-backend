# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: '>=1.0.0-beta.4'

name: openapi-manifest-orchestrator

services:
  openapi-manifest-orchestrator:
    project: src/openapi-manifest-orchestrator
    host: azure.ai.agent
    language: python
    uses:
      - ai-project
    codeConfiguration:
      dependencyResolution: remote_build
      entryPoint: main.py
      runtime: python_3_13
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    description: Checks a GitHub OpenAPI manifest for changed repositories and creates one specification and manifest update pull request.
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      - name: DISCOVERY_AGENT_NAME
        value: ${DISCOVERY_AGENT_NAME}
      - name: SPEC_WORKFLOW_AGENT_NAME
        value: ${SPEC_WORKFLOW_AGENT_NAME}
      - name: SPEC_PR_CREATOR_AGENT_NAME
        value: ${SPEC_PR_CREATOR_AGENT_NAME}
      - name: OPENAPI_MANIFEST_MAX_ENTRIES
        value: ${OPENAPI_MANIFEST_MAX_ENTRIES}
      - name: OPENAPI_MANIFEST_MAX_SPECS
        value: ${OPENAPI_MANIFEST_MAX_SPECS}
      - name: OPENAPI_MANIFEST_BATCH_SIZE
        value: ${OPENAPI_MANIFEST_BATCH_SIZE}
      - name: OPENAPI_MANIFEST_WORKFLOW_CONCURRENCY
        value: ${OPENAPI_MANIFEST_WORKFLOW_CONCURRENCY}
      - name: GITHUB_APP_ID
        value: ${{connections.atlas-github-app.credentials.app_id}}
      - name: GITHUB_APP_PRIVATE_KEY
        value: ${{connections.atlas-github-app.credentials.private_key}}
    kind: hosted
    name: openapi-manifest-orchestrator
    displayName: OpenAPI Manifest Orchestrator
    protocols:
      - protocol: responses
        version: 2.0.0

  ai-project:
    host: azure.ai.project
    endpoint: ${AZURE_AI_PROJECT_ENDPOINT}

infra:
  provider: microsoft.foundry

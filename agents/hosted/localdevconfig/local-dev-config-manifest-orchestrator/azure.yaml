# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: '>=1.0.0-beta.4'

name: local-dev-config-manifest-orchestrator

services:
  local-dev-config-manifest-orchestrator:
    project: src/local-dev-config-manifest-orchestrator
    host: azure.ai.agent
    language: python
    uses: [ai-project]
    codeConfiguration:
      dependencyResolution: remote_build
      entryPoint: main.py
      runtime: python_3_13
    container:
      resources: { cpu: "0.5", memory: 1Gi }
    description: Checks shared manifest local-dev-config nodes for changed repositories and creates one combined catalog and manifest update pull request.
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      - name: LOCAL_DEV_CONFIG_WORKFLOW_AGENT_NAME
        value: ${LOCAL_DEV_CONFIG_WORKFLOW_AGENT_NAME}
      - name: LOCAL_DEV_CONFIG_PR_CREATOR_AGENT_NAME
        value: ${LOCAL_DEV_CONFIG_PR_CREATOR_AGENT_NAME}
      - name: LOCAL_DEV_CONFIG_MANIFEST_MAX_ENTRIES
        value: ${LOCAL_DEV_CONFIG_MANIFEST_MAX_ENTRIES}
      - name: LOCAL_DEV_CONFIG_MANIFEST_MAX_CATALOGS
        value: ${LOCAL_DEV_CONFIG_MANIFEST_MAX_CATALOGS}
      - name: LOCAL_DEV_CONFIG_MANIFEST_WORKFLOW_CONCURRENCY
        value: ${LOCAL_DEV_CONFIG_MANIFEST_WORKFLOW_CONCURRENCY}
      - name: GITHUB_READ_TOKEN
        value: ${{connections.openapi-pr-github.credentials.github_token}}
      - name: GITHUB_APP_ID
        value: ${{connections.atlas-github-app.credentials.app_id}}
      - name: GITHUB_APP_PRIVATE_KEY
        value: ${{connections.atlas-github-app.credentials.private_key}}
    kind: hosted
    name: local-dev-config-manifest-orchestrator
    displayName: Local Dev Config Manifest Orchestrator
    protocols:
      - protocol: responses
        version: 2.0.0
  ai-project:
    host: azure.ai.project
    endpoint: ${AZURE_AI_PROJECT_ENDPOINT}

infra:
  provider: microsoft.foundry

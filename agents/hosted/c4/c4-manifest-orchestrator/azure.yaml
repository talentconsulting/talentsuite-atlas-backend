# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: '>=1.0.0-beta.4'

name: c4-manifest-orchestrator

services:
  c4-manifest-orchestrator:
    project: src/c4-manifest-orchestrator
    host: azure.ai.agent
    language: python
    uses: [ai-project]
    codeConfiguration:
      dependencyResolution: remote_build
      entryPoint: main.py
      runtime: python_3_13
    container:
      resources: { cpu: "0.5", memory: 1Gi }
    description: Checks shared manifest C4 nodes for changed repositories and creates one diagrams and manifest update pull request.
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      - name: C4_WORKFLOW_AGENT_NAME
        value: ${C4_WORKFLOW_AGENT_NAME}
      - name: C4_PR_CREATOR_AGENT_NAME
        value: ${C4_PR_CREATOR_AGENT_NAME}
      - name: C4_MANIFEST_MAX_ENTRIES
        value: ${C4_MANIFEST_MAX_ENTRIES}
      - name: C4_MANIFEST_MAX_CATALOGS
        value: ${C4_MANIFEST_MAX_CATALOGS}
      - name: C4_MANIFEST_WORKFLOW_CONCURRENCY
        value: ${C4_MANIFEST_WORKFLOW_CONCURRENCY}
      - name: GITHUB_READ_TOKEN
        value: ${{connections.openapi-pr-github.credentials.github_token}}
      - name: GITHUB_APP_ID
        value: ${{connections.atlas-github-app.credentials.app_id}}
      - name: GITHUB_APP_PRIVATE_KEY
        value: ${{connections.atlas-github-app.credentials.private_key}}
    kind: hosted
    name: c4-manifest-orchestrator
    displayName: C4 Manifest Orchestrator
    protocols:
      - protocol: responses
        version: 2.0.0
  ai-project:
    host: azure.ai.project
    endpoint: ${AZURE_AI_PROJECT_ENDPOINT}

infra:
  provider: microsoft.foundry

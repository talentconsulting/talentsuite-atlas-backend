name: eventcatalog-source-discovery
services:
  eventcatalog-source-discovery:
    project: src/eventcatalog-source-discovery
    host: azure.ai.agent
    language: python
    uses: [ai-project]
    codeConfiguration:
      dependencyResolution: remote_build
      entryPoint: main.py
      runtime: python_3_13
    container:
      resources: { cpu: "0.5", memory: 1Gi }
    description: Selects bounded, authoritative event and command catalog source files from one public GitHub repository path.
    environmentVariables:
      - name: EVENTCATALOG_DISCOVERY_MAX_FILES
        value: ${EVENTCATALOG_DISCOVERY_MAX_FILES}
      - name: EVENTCATALOG_DISCOVERY_MAX_BYTES
        value: ${EVENTCATALOG_DISCOVERY_MAX_BYTES}
      - name: GITHUB_READ_TOKEN
        value: ${{connections.github-source-read.credentials.github_token}}
    kind: hosted
    name: eventcatalog-source-discovery
    displayName: Event and Command Catalog Source Discovery
    protocols:
      - protocol: responses
        version: 2.0.0
  ai-project:
    host: azure.ai.project
    endpoint: ${AZURE_AI_PROJECT_ENDPOINT}
infra:
  provider: microsoft.foundry

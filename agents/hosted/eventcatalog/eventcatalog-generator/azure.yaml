# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: '>=1.0.0-beta.4'

name: eventcatalog-generator

services:
  eventcatalog-generator:
    project: src/eventcatalog-generator
    host: azure.ai.agent
    language: python
    uses:
      - ai-project
    codeConfiguration:
      dependencyResolution: remote_build
      entryPoint: main.py
      runtime: python_3_13
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    description: Reads selected event and command source files and returns a validated JSON catalog of messages, fields, and handlers.
    environmentVariables:
      - name: USAGE_LEDGER_URL
        value: ${{connections.atlas-usage-ledger.credentials.table_url}}
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      - name: GITHUB_APP_ID
        value: ${{connections.atlas-github-app.credentials.app_id}}
      - name: GITHUB_APP_PRIVATE_KEY
        value: ${{connections.atlas-github-app.credentials.private_key}}
    kind: hosted
    name: eventcatalog-generator
    displayName: Event and Command Catalog Generator
    protocols:
      - protocol: responses
        version: 2.0.0

  ai-project:
    host: azure.ai.project
    endpoint: ${AZURE_AI_PROJECT_ENDPOINT}

infra:
  provider: microsoft.foundry

# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: '>=1.0.0-beta.4'

name: user-journeys-workflow

services:
  user-journeys-workflow:
    project: src/user-journeys-workflow
    host: azure.ai.agent
    language: python
    uses:
      - ai-project
    codeConfiguration:
      dependencyResolution: remote_build
      entryPoint: main.py
      runtime: python_3_13
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    description: Builds, describes and optionally publishes one web repository's user journeys.
    environmentVariables:
      - name: USER_JOURNEYS_DISCOVERY_AGENT_NAME
        value: ${USER_JOURNEYS_DISCOVERY_AGENT_NAME}
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      - name: USER_JOURNEYS_GENERATOR_AGENT_NAME
        value: ${USER_JOURNEYS_GENERATOR_AGENT_NAME}
      - name: USER_JOURNEYS_PR_CREATOR_AGENT_NAME
        value: ${USER_JOURNEYS_PR_CREATOR_AGENT_NAME}
      - name: USER_JOURNEYS_GENERATOR_CONCURRENCY
        value: ${USER_JOURNEYS_GENERATOR_CONCURRENCY}
    kind: hosted
    name: user-journeys-workflow
    displayName: User Journeys Workflow
    protocols:
      - protocol: responses
        version: 2.0.0

  ai-project:
    host: azure.ai.project
    endpoint: ${AZURE_AI_PROJECT_ENDPOINT}

infra:
  provider: microsoft.foundry

# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: '>=1.0.0-beta.4'

name: user-journeys-source-discovery

services:
  user-journeys-source-discovery:
    project: src/user-journeys-source-discovery
    host: azure.ai.agent
    language: python
    uses: [ai-project]
    codeConfiguration:
      dependencyResolution: remote_build
      entryPoint: main.py
      runtime: python_3_13
    container:
      resources: { cpu: "0.5", memory: 1Gi }
    description: Builds the navigation graph (pages, links and redirects, with source evidence) of the ASP.NET web projects beneath one GitHub repository path.
    environmentVariables:
      - name: GITHUB_READ_TOKEN
        value: ${{connections.github-source-read.credentials.github_token}}
    kind: hosted
    name: user-journeys-source-discovery
    displayName: User Journeys Source Discovery
    protocols:
      - protocol: responses
        version: 2.0.0
  ai-project:
    host: azure.ai.project
    endpoint: ${AZURE_AI_PROJECT_ENDPOINT}

infra:
  provider: microsoft.foundry

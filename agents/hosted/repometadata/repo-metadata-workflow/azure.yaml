# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: '>=1.0.0-beta.4'

name: repo-metadata-workflow

services:
  repo-metadata-workflow:
    project: src/repo-metadata-workflow
    host: azure.ai.agent
    language: python
    uses:
      - ai-project
    codeConfiguration:
      dependencyResolution: remote_build
      entryPoint: main.py
      runtime: python_3_13
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    description: Generates and optionally publishes one repository's .NET version catalog.
    environmentVariables:
      - name: REPO_METADATA_DISCOVERY_AGENT_NAME
        value: ${REPO_METADATA_DISCOVERY_AGENT_NAME}
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      - name: REPO_METADATA_GENERATOR_AGENT_NAME
        value: ${REPO_METADATA_GENERATOR_AGENT_NAME}
      - name: REPO_METADATA_PR_CREATOR_AGENT_NAME
        value: ${REPO_METADATA_PR_CREATOR_AGENT_NAME}
      - name: REPO_METADATA_DISCOVERY_MAX_FILES
        value: ${REPO_METADATA_DISCOVERY_MAX_FILES}
      - name: REPO_METADATA_GENERATOR_BATCH_SIZE
        value: ${REPO_METADATA_GENERATOR_BATCH_SIZE}
      - name: REPO_METADATA_GENERATOR_CONCURRENCY
        value: ${REPO_METADATA_GENERATOR_CONCURRENCY}
      - name: GITHUB_APP_ID
        value: ${{connections.atlas-github-app.credentials.app_id}}
      - name: GITHUB_APP_PRIVATE_KEY
        value: ${{connections.atlas-github-app.credentials.private_key}}
    kind: hosted
    name: repo-metadata-workflow
    displayName: .NET Version Workflow
    protocols:
      - protocol: responses
        version: 2.0.0

  ai-project:
    host: azure.ai.project
    endpoint: ${AZURE_AI_PROJECT_ENDPOINT}

infra:
  provider: microsoft.foundry

# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: '>=1.0.0-beta.4'

name: repo-metadata-generator

services:
  repo-metadata-generator:
    project: src/repo-metadata-generator
    host: azure.ai.agent
    language: python
    uses:
      - ai-project
    codeConfiguration:
      dependencyResolution: remote_build
      entryPoint: main.py
      runtime: python_3_13
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    description: Deterministically extracts target framework and SDK versions from a bounded set of .csproj and global.json files.
    environmentVariables:
      - name: GITHUB_APP_ID
        value: ${{connections.atlas-github-app.credentials.app_id}}
      - name: GITHUB_APP_PRIVATE_KEY
        value: ${{connections.atlas-github-app.credentials.private_key}}
    kind: hosted
    name: repo-metadata-generator
    displayName: .NET Version Generator
    protocols:
      - protocol: responses
        version: 2.0.0

  ai-project:
    host: azure.ai.project
    endpoint: ${AZURE_AI_PROJECT_ENDPOINT}

infra:
  provider: microsoft.foundry

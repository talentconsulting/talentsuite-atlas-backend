# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: '>=1.0.0-beta.4'

name: system-summary-generator

services:
  system-summary-generator:
    project: src/system-summary-generator
    host: azure.ai.agent
    language: python
    uses: [ai-project]
    codeConfiguration:
      dependencyResolution: remote_build
      entryPoint: main.py
      runtime: python_3_13
    container:
      resources: { cpu: "0.5", memory: 1Gi }
    description: Reads a repository's already-published database, event, and dependency catalogs and returns a factual system summary.
    environmentVariables:
      - name: USAGE_LEDGER_URL
        value: ${{connections.atlas-usage-ledger.credentials.table_url}}
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    kind: hosted
    name: system-summary-generator
    displayName: System Summary Generator
    protocols:
      - protocol: responses
        version: 2.0.0
  ai-project:
    host: azure.ai.project
    endpoint: ${AZURE_AI_PROJECT_ENDPOINT}

infra:
  provider: microsoft.foundry

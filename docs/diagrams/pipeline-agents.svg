<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 994 404" width="994" height="404" role="img" aria-label="OpenAPI flow agents: the caller sends a manifest URL to openapi-manifest-orchestrator, which reads the manifest from talentsuite-atlas and branch heads from the source repositories, calls openapi-spec-workflow once per changed repository, then sends everything to openapi-spec-pr-creator. The workflow calls openapi-source-discovery and openapi-spec-generator, which read the source repositories. The PR creator opens a pull request on talentsuite-atlas.">
<title>OpenAPI flow agents: the caller sends a manifest URL to openapi-manifest-orchestrator, which reads the manifest from talentsuite-atlas and branch heads from the source repositories, calls openapi-spec-workflow once per changed repository, then sends everything to openapi-spec-pr-creator. The workflow calls openapi-source-discovery and openapi-spec-generator, which read the source repositories. The PR creator opens a pull request on talentsuite-atlas.</title>
<style>
svg { --surface:#ffffff; --bg:#f5f6fb; --fg:#0b1640; --muted:#56608a; --line:#cfd5ea; --read:#00826a; --write:#d4105a; --warn:#a65400; --install:rgba(255,47,119,0.10); --install-edge:rgba(212,16,90,0.55); color:var(--fg); }
@media (prefers-color-scheme: dark) {
  svg { --surface:#031548; --bg:#000a2b; --fg:#eef1ff; --muted:#9ba7cc; --line:#1f3577; --read:#00c49d; --write:#ff2f77; --warn:#f5a524; --install:rgba(255,47,119,0.16); --install-edge:rgba(255,47,119,0.6); }
}
.canvas { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: var(--fg); }
.t-b { font-weight: 600; }
.t-m { fill: var(--muted); font-size: 12px; }
.t-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.t-warn { fill: var(--warn); font-size: 12px; font-weight: 600; }
.t-read { fill: var(--read); font-size: 12px; font-weight: 600; }
.t-write { fill: var(--write); font-size: 12px; font-weight: 600; }
.box { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
.box-strong { fill: var(--surface); stroke: var(--fg); stroke-width: 1.5; }
.group { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; }
.org { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 5; }
.inst { fill: var(--install); stroke: var(--install-edge); stroke-width: 1.5; }
.key { fill: var(--surface); stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 4 3; }
.ln { fill: none; stroke: var(--fg); stroke-width: 1.5; }
.ln-read { fill: none; stroke: var(--read); stroke-width: 2.25; }
.ln-write { fill: none; stroke: var(--write); stroke-width: 2.25; }
.ln-warn { fill: none; stroke: var(--warn); stroke-width: 2.25; stroke-dasharray: 6 4; }
.mk-fg { fill: var(--fg); }
.mk-read { fill: var(--read); }
.mk-write { fill: var(--write); }
.mk-warn { fill: var(--warn); }
.t-sm { font-size: 11px; }
.diamond { fill: var(--surface); stroke: var(--fg); stroke-width: 1.5; }
</style>
<rect class="canvas" x="-11.5" y="-11.5" width="993" height="403" rx="12"/>
<defs>
  <marker id="p2-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-fg" d="M0 0 L10 5 L0 10 z"/></marker>
  <marker id="p2-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk-read" d="M0 0 L10 5 L0 10 z"/></marker>
  <marker id="p2-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk-write" d="M0 0 L10 5 L0 10 z"/></marker>
</defs>
<rect class="box-strong" x="20" y="40" width="120" height="44" rx="8"/>
<text class="t-b" x="34" y="59">Caller</text>
<text class="t-m" x="34" y="76">manifest URL</text>
<line class="ln" x1="140" y1="62" x2="178" y2="62" marker-end="url(#p2-fg)"/>

<rect class="box" x="180" y="40" width="250" height="44" rx="6"/>
<text class="t-mono t-b" x="194" y="59">openapi-manifest-orchestrator</text>
<text class="t-m" x="194" y="76">checks every manifest entry</text>

<rect class="box" x="470" y="40" width="190" height="44" rx="6"/>
<text class="t-mono t-b" x="484" y="59">openapi-spec-workflow</text>
<text class="t-m" x="484" y="76">once per changed repo</text>
<line class="ln" x1="430" y1="62" x2="468" y2="62" marker-end="url(#p2-fg)"/>

<rect class="box" x="375" y="150" width="185" height="40" rx="6"/>
<text class="t-mono t-sm" x="387" y="174">openapi-source-discovery</text>
<rect class="box" x="575" y="150" width="180" height="40" rx="6"/>
<text class="t-mono t-sm" x="587" y="174">openapi-spec-generator</text>
<line class="ln" x1="500" y1="84" x2="500" y2="148" marker-end="url(#p2-fg)"/>
<line class="ln" x1="630" y1="84" x2="630" y2="148" marker-end="url(#p2-fg)"/>
<text class="t-m" x="638" y="122">once per API</text>

<rect class="box" x="762" y="150" width="180" height="40" rx="6"/>
<text class="t-mono t-sm" x="774" y="174">openapi-spec-pr-creator</text>
<path class="ln" d="M305 40 V30 H850 V148" marker-end="url(#p2-fg)"/>
<text class="t-m" x="858" y="122">all specs +</text>
<text class="t-m" x="858" y="138">manifest update</text>

<path class="ln-read" d="M280 40 V18 H955 V320 H942" marker-end="url(#p2-read)"/>
<text class="t-read" x="600" y="12">reads manifest</text>

<rect class="org" x="180" y="280" width="575" height="80" rx="10"/>
<text class="t-b" x="196" y="304">Source repositories</text>
<text class="t-m" x="196" y="324">the code being analysed, one per manifest entry</text>
<path class="ln-read" d="M305 84 V278" marker-end="url(#p2-read)"/>
<text class="t-read" x="313" y="240">branch heads</text>
<path class="ln-read" d="M467 190 V278" marker-end="url(#p2-read)"/>
<text class="t-read" x="475" y="240">archive</text>
<path class="ln-read" d="M665 190 V278" marker-end="url(#p2-read)"/>
<text class="t-read" x="673" y="240">files</text>

<rect class="box-strong" x="765" y="280" width="175" height="80" rx="8"/>
<text class="t-mono t-b" x="781" y="304">talentsuite-atlas</text>
<text class="t-m" x="781" y="324">manifest.json</text>
<text class="t-m" x="781" y="342">generated specs</text>
<path class="ln-write" d="M852 190 V278" marker-end="url(#p2-write)"/>
<text class="t-write" x="860" y="240">opens PR</text>
</svg>

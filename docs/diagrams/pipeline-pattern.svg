<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 984 424" width="984" height="424" role="img" aria-label="Every pipeline: the manifest orchestrator reads the manifest from talentsuite-atlas, runs the workflow once per changed manifest entry (retrieve files, then create artefacts, both reading the repository being analysed), and when no entries remain the PR creator opens one pull request on talentsuite-atlas.">
<title>Every pipeline: the manifest orchestrator reads the manifest from talentsuite-atlas, runs the workflow once per changed manifest entry (retrieve files, then create artefacts, both reading the repository being analysed), and when no entries remain the PR creator opens one pull request on talentsuite-atlas.</title>
<style>
svg { --surface:#ffffff; --bg:#f5f6fb; --fg:#0b1640; --muted:#56608a; --line:#cfd5ea; --read:#00826a; --write:#d4105a; --warn:#a65400; --install:rgba(255,47,119,0.10); --install-edge:rgba(212,16,90,0.55); color:var(--fg); }
@media (prefers-color-scheme: dark) {
  svg { --surface:#031548; --bg:#000a2b; --fg:#eef1ff; --muted:#9ba7cc; --line:#1f3577; --read:#00c49d; --write:#ff2f77; --warn:#f5a524; --install:rgba(255,47,119,0.16); --install-edge:rgba(255,47,119,0.6); }
}
.canvas { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: var(--fg); }
.t-b { font-weight: 600; }
.t-m { fill: var(--muted); font-size: 12px; }
.t-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.t-warn { fill: var(--warn); font-size: 12px; font-weight: 600; }
.t-read { fill: var(--read); font-size: 12px; font-weight: 600; }
.t-write { fill: var(--write); font-size: 12px; font-weight: 600; }
.box { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
.box-strong { fill: var(--surface); stroke: var(--fg); stroke-width: 1.5; }
.group { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; }
.org { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 5; }
.inst { fill: var(--install); stroke: var(--install-edge); stroke-width: 1.5; }
.key { fill: var(--surface); stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 4 3; }
.ln { fill: none; stroke: var(--fg); stroke-width: 1.5; }
.ln-read { fill: none; stroke: var(--read); stroke-width: 2.25; }
.ln-write { fill: none; stroke: var(--write); stroke-width: 2.25; }
.ln-warn { fill: none; stroke: var(--warn); stroke-width: 2.25; stroke-dasharray: 6 4; }
.mk-fg { fill: var(--fg); }
.mk-read { fill: var(--read); }
.mk-write { fill: var(--write); }
.mk-warn { fill: var(--warn); }
.diamond { fill: var(--surface); stroke: var(--fg); stroke-width: 1.5; }
</style>
<rect class="canvas" x="-11.5" y="-11.5" width="983" height="423" rx="12"/>
<defs>
  <marker id="p1-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-fg" d="M0 0 L10 5 L0 10 z"/></marker>
  <marker id="p1-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk-read" d="M0 0 L10 5 L0 10 z"/></marker>
  <marker id="p1-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk-write" d="M0 0 L10 5 L0 10 z"/></marker>
</defs>
<rect class="box-strong" x="20" y="40" width="200" height="58" rx="8"/>
<text class="t-b" x="36" y="64">Manifest orchestrator</text>
<text class="t-m" x="36" y="84">one per flow</text>

<rect class="box-strong" x="20" y="300" width="200" height="72" rx="8"/>
<text class="t-mono t-b" x="36" y="324">talentsuite-atlas</text>
<text class="t-m" x="36" y="344">manifest.json</text>
<text class="t-m" x="36" y="362">generated catalogues</text>
<path class="ln-read" d="M120 98 V298" marker-end="url(#p1-read)"/>
<text class="t-read" x="128" y="204">reads manifest</text>

<rect class="group" x="270" y="24" width="400" height="330" rx="10"/>
<text class="t-b" x="286" y="46">Workflow · once per changed manifest entry</text>
<rect class="box" x="290" y="60" width="360" height="36" rx="18"/>
<text x="470" y="83" text-anchor="middle">Next manifest entry</text>
<path class="ln" d="M220 78 H288" marker-end="url(#p1-fg)"/>
<text class="t-m" x="228" y="70">start</text>

<rect class="box" x="290" y="124" width="360" height="44" rx="6"/>
<text class="t-b" x="306" y="143">Retrieve files</text>
<text class="t-m" x="306" y="160">source discovery agent</text>
<rect class="box" x="290" y="204" width="360" height="44" rx="6"/>
<text class="t-b" x="306" y="223">Create artefacts</text>
<text class="t-m" x="306" y="240">generator agent</text>
<polygon class="diamond" points="400,300 470,278 540,300 470,322"/>
<text x="470" y="305" text-anchor="middle">More entries?</text>

<line class="ln" x1="470" y1="96" x2="470" y2="122" marker-end="url(#p1-fg)"/>
<line class="ln" x1="470" y1="168" x2="470" y2="202" marker-end="url(#p1-fg)"/>
<text class="t-m" x="478" y="190">JSON: files to process</text>
<line class="ln" x1="470" y1="248" x2="470" y2="276" marker-end="url(#p1-fg)"/>
<text class="t-m" x="478" y="266">JSON: artefacts</text>
<path class="ln" d="M400 300 H284 V78 H288" marker-end="url(#p1-fg)"/>
<text class="t-m" x="300" y="294">yes</text>

<rect class="org" x="720" y="110" width="220" height="150" rx="10"/>
<text class="t-b" x="736" y="134">Repository being analysed</text>
<text class="t-m" x="736" y="154">one per manifest entry</text>
<path class="ln-read" d="M650 146 H718" marker-end="url(#p1-read)"/>
<text class="t-read" x="660" y="138">reads</text>
<path class="ln-read" d="M650 226 H718" marker-end="url(#p1-read)"/>
<text class="t-read" x="660" y="218">reads</text>

<rect class="box-strong" x="720" y="278" width="220" height="44" rx="8"/>
<text class="t-b" x="736" y="297">PR creator</text>
<text class="t-m" x="736" y="314">one pull request per run</text>
<path class="ln" d="M540 300 H718" marker-end="url(#p1-fg)"/>
<text class="t-m" x="556" y="292">no: publish</text>
<path class="ln-write" d="M830 322 V386 H160 V374" marker-end="url(#p1-write)"/>
<text class="t-write" x="480" y="380" text-anchor="middle">opens one pull request with every artefact and manifest update</text>
</svg>

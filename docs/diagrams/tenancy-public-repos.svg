<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 984 484" width="984" height="484" role="img" aria-label="Northwind: the App is installed only on talentconsulting/northwind-atlas. Agents read Northwind's public repos with a read-only token and open pull requests on northwind-atlas with a write token limited to that repo.">
<title>Northwind: the App is installed only on talentconsulting/northwind-atlas. Agents read Northwind's public repos with a read-only token and open pull requests on northwind-atlas with a write token limited to that repo.</title>
<style>
svg { --surface:#ffffff; --bg:#f5f6fb; --fg:#0b1640; --muted:#56608a; --line:#cfd5ea; --read:#00826a; --write:#d4105a; --warn:#a65400; --install:rgba(255,47,119,0.10); --install-edge:rgba(212,16,90,0.55); color:var(--fg); }
@media (prefers-color-scheme: dark) {
  svg { --surface:#031548; --bg:#000a2b; --fg:#eef1ff; --muted:#9ba7cc; --line:#1f3577; --read:#00c49d; --write:#ff2f77; --warn:#f5a524; --install:rgba(255,47,119,0.16); --install-edge:rgba(255,47,119,0.6); }
}
.canvas { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: var(--fg); }
.t-b { font-weight: 600; }
.t-m { fill: var(--muted); font-size: 12px; }
.t-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.t-warn { fill: var(--warn); font-size: 12px; font-weight: 600; }
.t-read { fill: var(--read); font-size: 12px; font-weight: 600; }
.t-write { fill: var(--write); font-size: 12px; font-weight: 600; }
.box { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
.box-strong { fill: var(--surface); stroke: var(--fg); stroke-width: 1.5; }
.group { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; }
.org { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 5; }
.inst { fill: var(--install); stroke: var(--install-edge); stroke-width: 1.5; }
.key { fill: var(--surface); stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 4 3; }
.ln { fill: none; stroke: var(--fg); stroke-width: 1.5; }
.ln-read { fill: none; stroke: var(--read); stroke-width: 2.25; }
.ln-write { fill: none; stroke: var(--write); stroke-width: 2.25; }
.ln-warn { fill: none; stroke: var(--warn); stroke-width: 2.25; stroke-dasharray: 6 4; }
.mk-fg { fill: var(--fg); }
.mk-read { fill: var(--read); }
.mk-write { fill: var(--write); }
.mk-warn { fill: var(--warn); }
</style>
<rect class="canvas" x="-11.5" y="-11.5" width="983" height="483" rx="12"/>
<defs>
            <marker id="d1-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-fg" d="M0 0 L10 5 L0 10 z"/></marker>
            <marker id="d1-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk-read" d="M0 0 L10 5 L0 10 z"/></marker>
            <marker id="d1-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk-write" d="M0 0 L10 5 L0 10 z"/></marker>
          </defs>

          <!-- Shared left column: trigger, agents, token minting -->
          <rect class="box-strong" x="20" y="24" width="310" height="58" rx="8"/>
          <text class="t-b" x="36" y="48">talentsuite-atlas-backend</text>
          <text class="t-m" x="36" y="68">Run All Flows · manifest URL for Northwind</text>
          <line class="ln" x1="175" y1="82" x2="175" y2="118" marker-end="url(#d1-fg)"/>
          <text class="t-m" x="186" y="97">tenant =</text><text class="t-m" x="186" y="112">talentconsulting/northwind-atlas</text>

          <rect class="group" x="20" y="122" width="310" height="226" rx="10"/>
          <text class="t-b" x="36" y="144">Foundry agents · shared by every tenant</text>
          <rect class="box" x="40" y="156" width="270" height="34" rx="6"/>
          <text x="56" y="178">Source discovery · generators</text>
          <rect class="box" x="40" y="198" width="270" height="34" rx="6"/>
          <text x="56" y="220">Manifest orchestrator</text>
          <rect class="box" x="40" y="240" width="270" height="34" rx="6"/>
          <text x="56" y="262">PR creator</text>
          <rect class="key" x="40" y="290" width="270" height="44" rx="6"/>
          <text class="t-b" x="56" y="309">atlas-github-app connection</text>
          <text class="t-m" x="56" y="326">App ID + private key</text>

          <line class="ln" x1="175" y1="352" x2="175" y2="384" marker-start="url(#d1-fg)" marker-end="url(#d1-fg)"/>
          <text class="t-m" x="186" y="372">tenant in, token out</text>
          <rect class="box-strong" x="20" y="388" width="310" height="58" rx="8"/>
          <text class="t-b" x="36" y="412">GitHub · mint a 1-hour token</text>
          <text class="t-m" x="36" y="432">from the installation on the data repo</text>

          <!-- Right: public source org, no installation -->
          <rect class="org" x="420" y="24" width="330" height="190" rx="10"/>
          <text class="t-b" x="436" y="46">northwind · public</text>
          <rect class="box" x="436" y="62" width="144" height="30" rx="5"/><text class="t-mono" x="446" y="82">inventory-api</text>
          <rect class="box" x="590" y="62" width="144" height="30" rx="5"/><text class="t-mono" x="600" y="82">storefront-web</text>
          <rect class="box" x="436" y="100" width="144" height="30" rx="5"/><text class="t-mono" x="446" y="120">payments-api</text>
          <rect class="box" x="590" y="100" width="144" height="30" rx="5"/><text class="t-mono" x="600" y="120">+ 20 more</text>
          <text class="t-m" x="436" y="166">App not installed here.</text>
          <text class="t-m" x="436" y="184">The repos are public, so any token can read them.</text>

          <!-- Right: data org with the installation -->
          <rect class="org" x="420" y="250" width="330" height="196" rx="10"/>
          <text class="t-b" x="436" y="272">talentconsulting</text>
          <text class="t-write" x="734" y="272" text-anchor="end">App installed</text>
          <rect class="inst" x="436" y="284" width="298" height="146" rx="8"/>
          <text class="t-mono t-b" x="452" y="310">northwind-atlas</text>
          <text class="t-m" x="452" y="332">the only repo the installation covers</text>
          <text class="t-m" x="452" y="362">manifest.json</text>
          <text class="t-m" x="452" y="382">catalogues: schemas, events, …</text>
          <text class="t-m" x="452" y="402">pull requests land here</text>

          <rect class="box-strong" x="790" y="330" width="150" height="56" rx="8"/>
          <text class="t-b" x="806" y="354">Render viewer</text>
          <text class="t-m" x="806" y="374">Northwind's site</text>
          <line class="ln" x1="734" y1="358" x2="788" y2="358" marker-end="url(#d1-fg)"/>
          <text class="t-m" x="756" y="350">reads</text>

          <!-- Token use -->
          <path class="ln-read" d="M310 173 H372 V115 H434" marker-end="url(#d1-read)"/>
          <text class="t-read" x="336" y="166">read</text>
          <path class="ln-read" d="M310 215 H408 V358 H434" marker-end="url(#d1-read)"/>
          <text class="t-read" x="336" y="208">manifest</text>
          <path class="ln-write" d="M310 257 H392 V400 H434" marker-end="url(#d1-write)"/>
          <text class="t-write" x="336" y="250">open PR</text>
</svg>

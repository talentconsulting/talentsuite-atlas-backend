name: Check Dependabot Alerts

on:
  workflow_dispatch: {}
  # Weekly refresh of each manifest repository's open Dependabot alerts.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One run per tenant data repository. ATLAS_DATA_REPOSITORIES is a JSON array of owner/repo names.
        repository: ${{ fromJSON(vars.ATLAS_DATA_REPOSITORIES || '["talentconsulting/atlas-dfe"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Dependabot alerts for every manifest repository
        env:
          DEPENDABOT_ALERTS_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
          GITHUB_PR_TOKEN: ${{ secrets.SERVICE_CATALOGUE_PR_TOKEN }}
          MANIFEST_SOURCE_URL: https://github.com/${{ matrix.repository }}/blob/main/manifest.json
        run: python3 scripts/check_dependabot_alerts.py

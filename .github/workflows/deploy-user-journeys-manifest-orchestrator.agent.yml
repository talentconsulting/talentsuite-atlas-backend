name: Deploy User Journeys Manifest Orchestrator

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to use."
        required: true
        type: choice
        default: dev
        options:
          - dev
          - test

jobs:
  deploy:
    uses: ./.github/workflows/deploy-user-journeys-agent.reusable.yml
    with:
      environment: ${{ inputs.environment }}
      project_dir: agents/hosted/userjourneys/user-journeys-manifest-orchestrator
      service_name: user-journeys-manifest-orchestrator
      expected_marker: invalid_input
    secrets: inherit

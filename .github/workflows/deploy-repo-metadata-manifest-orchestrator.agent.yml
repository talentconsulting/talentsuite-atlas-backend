name: Deploy .NET Version Manifest Orchestrator

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to use."
        required: true
        type: choice
        default: dev
        options:
          - dev
          - test

jobs:
  deploy:
    uses: ./.github/workflows/deploy-repo-metadata-agent.reusable.yml
    with:
      environment: ${{ inputs.environment }}
      project_dir: agents/hosted/repometadata/repo-metadata-manifest-orchestrator
      service_name: repo-metadata-manifest-orchestrator
      expected_marker: invalid_input
    secrets: inherit

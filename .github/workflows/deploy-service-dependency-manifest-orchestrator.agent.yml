name: Deploy Service Dependency Manifest Orchestrator

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to use."
        required: true
        type: choice
        default: dev
        options:
          - dev
          - test

jobs:
  deploy:
    uses: ./.github/workflows/deploy-service-dependency-agent.reusable.yml
    with:
      environment: ${{ inputs.environment }}
      project_dir: agents/hosted/servicedependencies/service-dependency-manifest-orchestrator
      service_name: service-dependency-manifest-orchestrator
      expected_marker: invalid_input
    secrets: inherit

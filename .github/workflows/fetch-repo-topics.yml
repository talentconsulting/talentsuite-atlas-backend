name: Fetch Repository Topics

on:
  workflow_dispatch: {}
  # Topic changes never move a branch head, so poll for them. Runs where nothing
  # changed write identical files and open no pull request.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One run per tenant data repository. ATLAS_DATA_REPOSITORIES is a JSON array of owner/repo names.
        repository: ${{ fromJSON(vars.ATLAS_DATA_REPOSITORIES || '["talentconsulting/atlas-dfe"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch topics for every manifest repository
        env:
          GITHUB_PR_TOKEN: ${{ secrets.SERVICE_CATALOGUE_PR_TOKEN }}
          MANIFEST_SOURCE_URL: https://github.com/${{ matrix.repository }}/blob/main/manifest.json
        run: python3 scripts/fetch_repo_topics.py

name: Run All Flows Against A Repository

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to use."
        required: true
        type: choice
        default: dev
        options:
          - dev
          - test
      manifest_url:
        description: "Manifest blob URL, e.g. https://github.com/talentconsulting/talentsuite-atlas/blob/main/manifest.json"
        required: true
        type: string
      github_repo:
        description: "The 'github-repo' value to match in the manifest, e.g. https://github.com/owner/application"
        required: true
        type: string
      flows:
        description: "Comma-separated flows to run, or 'all' (only flows present on the matched manifest entry are ever run)"
        required: false
        type: string
        default: "all"
      defer_publication:
        description: "Generate only; skip opening pull requests"
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: run-all-flows-${{ inputs.manifest_url }}-${{ inputs.github_repo }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      target_repository: ${{ steps.resolve.outputs.target_repository }}
      target_base_branch: ${{ steps.resolve.outputs.target_base_branch }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        shell: bash
        env:
          MANIFEST_URL: ${{ inputs.manifest_url }}
          GITHUB_REPO_INPUT: ${{ inputs.github_repo }}
          REQUESTED_FLOWS: ${{ inputs.flows }}
        run: |
          set -euo pipefail

          if [[ "$MANIFEST_URL" =~ ^https://github\.com/([^/]+)/([^/]+)/blob/([^/]+)/(.+)$ ]]; then
            owner="${BASH_REMATCH[1]}"
            repo="${BASH_REMATCH[2]}"
            branch="${BASH_REMATCH[3]}"
            path="${BASH_REMATCH[4]}"
          else
            echo "::error::manifest_url must look like https://github.com/<owner>/<repo>/blob/<branch>/<path>/manifest.json"
            exit 1
          fi
          target_repository="$owner/$repo"
          target_base_branch="$branch"
          raw_url="https://raw.githubusercontent.com/$owner/$repo/$branch/$path"

          manifest_file="$RUNNER_TEMP/manifest.json"
          if ! curl -fsSL "$raw_url" -o "$manifest_file"; then
            echo "::error::Failed to fetch manifest from $raw_url"
            exit 1
          fi
          if ! jq -e . >/dev/null 2>&1 < "$manifest_file"; then
            echo "::error::Manifest at $raw_url is not valid JSON."
            exit 1
          fi

          keys_json="null"
          if [ "$REQUESTED_FLOWS" != "all" ] && [ -n "$REQUESTED_FLOWS" ]; then
            keys_json=$(printf '%s' "$REQUESTED_FLOWS" | tr ',' '\n' | sed '/^$/d' | jq -R . | jq -s .)
          fi

          result=$(jq --arg repo "$GITHUB_REPO_INPUT" --argjson keys "$keys_json" \
            -f ".github/workflows/scripts/manifest-entry-flows.jq" "$manifest_file")
          if printf '%s' "$result" | jq -e 'has("error")' >/dev/null; then
            echo "::error::$(printf '%s' "$result" | jq -r '.error')"
            exit 1
          fi

          matrix=$(printf '%s' "$result" | jq -c '.matrix')
          echo "Resolved matrix: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "target_repository=$target_repository" >> "$GITHUB_OUTPUT"
          echo "target_base_branch=$target_base_branch" >> "$GITHUB_OUTPUT"

  run:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AZD_ENV_NAME: ci
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.AZURE_AI_PROJECT_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID FOUNDRY_PROJECT_ENDPOINT; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing dev environment secret $name."
              missing=1
            fi
          done
          exit "$missing"

      - uses: Azure/setup-azd@v2

      - name: Install Foundry extensions
        run: azd extension install microsoft.foundry

      - name: Sign in to azd with GitHub federated credentials
        shell: bash
        run: |
          set -euo pipefail
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"

      - name: Configure Foundry environment for invoke
        working-directory: ${{ matrix.project_dir }}
        shell: bash
        # `azd ai agent invoke` resolves the current azd environment to route the call; with no
        # environment ever created in this checkout it fails with "default environment not found".
        # Only an environment needs to exist here (this workflow invokes an already-deployed
        # agent, it does not provision anything), so this sets just enough for that resolution to
        # succeed -- not the full set of vars the deploy workflows set for provisioning.
        # Deliberately no AZURE_SUBSCRIPTION_ID: the deploy workflows delete it before their own
        # `azd ai agent show`/`invoke` calls for the same reason (see their "Clear cached
        # subscription ID" step) -- azd's tenant lookup for a discoverable subscription ID has no
        # service-principal fast path and fails auth for this identity when it's set.
        run: |
          set -euo pipefail
          azd env select "$AZD_ENV_NAME" || azd env new "$AZD_ENV_NAME" --no-prompt
          azd env set AZURE_TENANT_ID "$AZURE_TENANT_ID"
          azd env set FOUNDRY_PROJECT_ENDPOINT "$FOUNDRY_PROJECT_ENDPOINT"
          azd env set AZURE_AI_PROJECT_ENDPOINT "$FOUNDRY_PROJECT_ENDPOINT"
          azd env set USE_EXISTING_AI_PROJECT true

      - name: Run ${{ matrix.key }}
        working-directory: ${{ matrix.project_dir }}
        shell: bash
        env:
          SOURCE_URL: ${{ matrix.source_url }}
          TARGET_REPOSITORY: ${{ needs.prepare.outputs.target_repository }}
          TARGET_BASE_BRANCH: ${{ needs.prepare.outputs.target_base_branch }}
          DEFER_PUBLICATION: ${{ inputs.defer_publication }}
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --arg sourceUrl "$SOURCE_URL" \
            --arg targetRepository "$TARGET_REPOSITORY" \
            --arg targetBaseBranch "$TARGET_BASE_BRANCH" \
            --argjson deferPublication "$DEFER_PUBLICATION" \
            '{sourceUrl: $sourceUrl, targetRepository: $targetRepository, tenant: $targetRepository}
             + (if $targetBaseBranch != "" then {targetBaseBranch: $targetBaseBranch} else {} end)
             + (if $deferPublication then {deferPublication: true} else {} end)')
          echo "Payload: $payload"
          response_file="$RUNNER_TEMP/${{ matrix.key }}-response.txt"
          agent_json_file="$RUNNER_TEMP/${{ matrix.key }}-agent-response.json"
          # A single repository can still involve substantial generation work; --timeout 0 removes
          # azd's default 1800s client timeout so the job's own GitHub Actions timeout is the only bound.
          azd ai agent invoke "${{ matrix.agent }}" "$payload" --no-prompt --timeout 0 --output raw > "$response_file" 2>&1 || true
          cat "$response_file"

          # --output raw prints the full HTTP response as a Server-Sent-Events stream, not a
          # single JSON document. The agent's actual JSON answer is the text field of the last
          # "data:" event (response.completed).
          last_data_line=$(grep '^data: ' "$response_file" | tail -1 || true)
          if [ -z "$last_data_line" ]; then
            echo "::error::${{ matrix.key }}: no SSE 'data:' event found in azd output (see raw output above)."
            exit 1
          fi
          if ! printf '%s' "$last_data_line" | sed 's/^data: //' | jq -e '.response.output[0].content[0].text' > /dev/null 2>&1; then
            echo "::error::${{ matrix.key }}: could not find the agent's response text in the SSE stream (see raw output above)."
            exit 1
          fi
          printf '%s' "$last_data_line" | sed 's/^data: //' | jq -r '.response.output[0].content[0].text' > "$agent_json_file"

          {
            echo "### ${{ matrix.key }}"
            echo '```json'
            cat "$agent_json_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if ! jq -e . >/dev/null 2>&1 < "$agent_json_file"; then
            echo "::error::${{ matrix.key }}: agent response was not valid JSON."
            cat "$agent_json_file"
            exit 1
          fi
          if [ "$(jq -r '.success' "$agent_json_file")" != "true" ]; then
            echo "::error::${{ matrix.key }}: workflow reported success=false: $(jq -c '.errors // .generationErrors // empty' "$agent_json_file")"
            exit 1
          fi
